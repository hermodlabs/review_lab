# Canonical assess-value-of-learning/1 model. No domain code or computed recommendation tables.
format: assess-value-of-learning/1
module:
  id: launch-review-value
  version: "1.1.0"
  title: Assess launch review value
  description: "Choose whether to commission an early launch-readiness review before reserving a complete operating policy. Compare targeted, full, noisy, missing-result and late reviews against the best no-review policy, using explicit joint readiness probabilities, complete operating consequences, cash requirements and deadlines. A review can improve a reservation choice while a later mandatory gate still controls dispatch."
  question: "Which early review and complete response policy provides the best modeled launch payoff before reservation closes?"
  boundary: "Synthetic launch L1; order PO1.v2; supplier S1; sites SP17,H1,DC1; snapshot precommit-0; two initial unresolved relations; one optional early review; one risk-neutral supplier; Days 0–9. Operating policies, authority, remedy capacity and deterministic timing are supplied reviewed premises. This app does not authenticate records, generate shipping plans, import UBL/EPCIS documents, establish actual permissions, or authorize dispatch."
  objective:
    criterion: risk-neutral-expected-money
    unit: hypothetical USD
    timeUnit: day
    beneficiary: "Fictional supplier S1, represented by launch owner Maya"
    horizon: "One launch L1 from Day 0 through Day 9; no later launch revenue or strategic shelf-presence benefit"
  attributes:
    - id: transportRegistered
      label: SP17 registered for transportation at precommit-0
      type: boolean
    - id: itemsAligned
      label: PO1.v2 items aligned with the declared route at precommit-0
      type: boolean
    - id: directReady
      label: Initial direct-route prerequisites satisfied
      type: boolean
    - id: supplierPortalListed
      label: SP17 listed in supplier portal at precommit-0
      type: boolean
    - id: ediAccepted
      label: Accepted EDI test premise
      type: boolean
    - id: freightPrepaid
      label: Agreed prepaid freight premise
      type: boolean
    - id: authorityConfirmed
      label: Authority for the scoped candidate policies
      type: boolean
    - id: backupRemedyConfirmed
      label: Backup capacity and remedy premise
      type: boolean
  states:
    - id: ready
      label: Both initial prerequisites satisfied
      attributes:
        transportRegistered: true
        itemsAligned: true
        directReady: true
        supplierPortalListed: true
        ediAccepted: true
        freightPrepaid: true
        authorityConfirmed: true
        backupRemedyConfirmed: true
    - id: transport-gap
      label: Transportation registration gap
      attributes:
        transportRegistered: false
        itemsAligned: true
        directReady: false
        supplierPortalListed: true
        ediAccepted: true
        freightPrepaid: true
        authorityConfirmed: true
        backupRemedyConfirmed: true
    - id: alignment-gap
      label: Item and route alignment gap
      attributes:
        transportRegistered: true
        itemsAligned: false
        directReady: false
        supplierPortalListed: true
        ediAccepted: true
        freightPrepaid: true
        authorityConfirmed: true
        backupRemedyConfirmed: true
    - id: both-gaps
      label: Both initial gaps
      attributes:
        transportRegistered: false
        itemsAligned: false
        directReady: false
        supplierPortalListed: true
        ediAccepted: true
        freightPrepaid: true
        authorityConfirmed: true
        backupRemedyConfirmed: true
  actions:
    - id: standard
      label: Reserve STANDARD
      description: "Reserve the scoped direct route; ship only if the Day-4 mandatory gate passes. Any initial gap means no shipment and the declared cancellation loss."
    - id: backup
      label: Reserve BACKUP
      description: Reserve the scoped authorized hub/remedy policy. The teaching fixture assumes capacity and remedy completion by the mandatory gate in every modeled initial state.
    - id: defer
      label: Hold and DEFER
      description: "Make no launch shipment in Days 0–9; preserve records and follow the agreed hold policy."
  studies:
    - id: transport-fast
      label: "Transportation-only exact review, fast"
      reports:
        - id: transport-clear
          label: Transportation registration clear
          kind: report
        - id: transport-gap
          label: Transportation registration gap
          kind: report
    - id: full-fast
      label: "Full exact review, fast"
      reports:
        - id: clear
          label: Both prerequisites clear
          kind: report
        - id: transport-gap
          label: Transportation gap
          kind: report
        - id: alignment-gap
          label: Alignment gap
          kind: report
        - id: both-gaps
          label: Both gaps
          kind: report
    - id: screen-fast
      label: "Joint screening review, fast"
      description: Clear/flag screen has 0.9 sensitivity and specificity for any gap. A clear screen does not establish either initial prerequisite.
      reports:
        - id: clear
          label: Clear screen
          kind: report
        - id: flag
          label: Flagged screen
          kind: report
    - id: dropout-fast
      label: Full exact review with possible no report
      reports:
        - id: clear
          label: Both prerequisites clear
          kind: report
        - id: transport-gap
          label: Transportation gap
          kind: report
        - id: alignment-gap
          label: Alignment gap
          kind: report
        - id: both-gaps
          label: Both gaps
          kind: report
        - id: no-report
          label: No report
          kind: no-report
    - id: full-slow
      label: "Full exact review, slow"
      description: The exact result arrives after the reservation deadline. No early reservation or reopened reservation window is offered.
      reports:
        - id: clear
          label: Both prerequisites clear
          kind: report
        - id: transport-gap
          label: Transportation gap
          kind: report
        - id: alignment-gap
          label: Alignment gap
          kind: report
        - id: both-gaps
          label: Both gaps
          kind: report
  assumptions: [The declared four-state basis exhausts only the two modeled initial unknowns. Supplier-portal listing is a different predicate from transportation registration., "The transportation and alignment extracts are partial. Missing rows do not assert false; accepted facts must be supplied explicitly to remove incompatible states.", An early review observes the initial snapshot and does not itself repair registration or alignment. Prospective report branches are not actual evidence rows., "STANDARD and BACKUP are supplied complete operating policies with reviewed authority, quantities, terms, timing, release gates and fallback. They are not generated or proven executable here.", No shipment occurs if the Day-4 mandatory gate fails. BACKUP deterministically remedies all modeled gaps by that gate under a strong supplied premise., "Review fee plus the action cash requirement must fit the available cash. The action payoff already includes operating and cancellation costs; cash requirements are not deducted again.", "The joint current distribution and all review likelihoods are synthetic assessments, not empirical estimates or consequences of GS1/UBL vocabulary.", "Reference records retain identity mappings, systems, snapshots, locators and review status. They do not become accepted facts or economic assumptions automatically."]
  metadata:
    catalog:
      domain:
        id: product-launches
        label: Product launches
        description: "Decisions about preparing, reviewing and committing a scoped product launch."
      useCase:
        id: choose-readiness-review
        label: Choose a launch-readiness review
        description: Compare early review and response policies before a launch reservation deadline.
    vocabularyReferences:
      - standard: OASIS UBL 2.4
        url: "https://docs.oasis-open.org/ubl/os-UBL-2.4/UBL-2.4.html"
        use: "Selected Party, Item, Order and Despatch/Delivery concepts; no XML import or conformance claim."
      - standard: GS1 GLN allocation rules
        url: "https://ref.gs1.org/standards/gln-allocation/"
        use: "Distinguish party identity and location identity; local synthetic IDs are not licensed GLNs."
      - standard: GS1 GTIN management
        url: "https://ref.gs1.org/standards/gtin-management/"
        use: "Trade-item identification vocabulary; SKU-A and SKU-B are local synthetic IDs, not assigned GTINs."
  presentation:
    labels:
      baseline: No additional early review
      study: Early review
      action: Operating policy
      state: Initial readiness state
      report: Review finding
    reports:
      comparison:
        title: Review investment
        question: "Which early review is worth commissioning before reservation?"
      responses:
        title: Reservation after each finding
        question: "Which complete operating policy follows every possible review result?"
      sensitivity:
        title: "What changes the investment?"
        question: "How do cash, fee and state assessments change the preferred review?"
      inputs:
        title: Launch basis and assumptions
        question: "Which scoped records, operating policies and model assumptions support this comparison?"
      history:
        title: Changed launch assumptions
        question: "What changed and which decision calculations must be revisited?"
    basisGroups:
      - id: scope
        title: Launch scope
        question: "What launch, owner, order revision, systems and decision horizon does this comparison cover?"
        description: Identified entities and the assessed snapshot keep every declaration attached to the same launch scope.
        sections: [scope]
        recordTypeIds: [entity, system, snapshot]
      - id: uncertainty
        title: Readiness & evidence
        question: "Which readiness states remain possible under the accepted assertions, with what assessed probabilities?"
        description: "Accepted assertions constrain the initial states; partial-source absence leaves the declared unknowns unresolved."
        sections: [uncertainty]
        recordTypeIds: [assertion, unknownRelation]
      - id: actions
        title: Operating choices
        question: "What complete operating policies can we reserve, under which deadlines and cash limits, and what are their modeled consequences?"
        description: "The supplied policies include their release gates and fallbacks; an early review does not authorize dispatch."
        sections: [actions]
        recordTypeIds: [operatingPolicy]
      - id: reviews
        title: Review methods
        question: "What can each early review report, how reliable is it in each state, and when and at what fee can it finish?"
        description: "Prospective review models include noisy, missing and late findings without promoting them to actual evidence."
        sections: [reviews]
        recordTypeIds: []
      - id: sources
        title: Sources & mappings
        question: "Where do the launch records and entity meanings come from, and which source and identity mappings were reviewed?"
        description: Inspect source coverage and locators alongside reviewed mappings and selected standard vocabulary correspondences.
        sections: []
        recordTypeIds: [source, mapping, identityMapping, standardMapping]
      - id: limits
        title: Assumptions & limits
        question: "Which operating and valuation premises, calculation limits and conclusion boundaries qualify this recommendation?"
        description: "Economic and operating assumptions remain explicit declarations, separate from source assertions and actual permission."
        sections: [assumptions, coverage]
        recordTypeIds: [decisionAssumption]
