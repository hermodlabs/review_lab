        op: exists
        atom:
          relation: expectedScope
          args: [deviceScope, "?value"]
    - id: SCOPE.REQUIRED.5
      label: Declare the current accountScope
      when: []
      assert:
        op: exists
        atom:
          relation: expectedScope
          args: [accountScope, "?value"]
    - id: SCOPE.EXACT
      label: Declare exactly the published scope fields
      when:
        - count:
            relation: expectedScope
            args: ["?field", "?value"]
          as: "?n"
      assert:
        op: eq
        args: ["?n", 6]
    - id: RECORD.KNOWN.CHECK.OUTCOME
      label: Every report identifies an outcome supported for its check
      when:
        - relation: observation
          args: ["?record", "?check", "?outcome", "?observed", "?source", "?person", "?text"]
      assert:
        op: exists
        atom:
          relation: checkOutcome
          args: ["?check", "?outcome"]
    - id: RECORD.NONNEGATIVE.TIME
      label: Each observation uses a nonnegative whole minute
      when:
        - relation: observation
          args: ["?record", "?check", "?outcome", "?observed", "?source", "?person", "?text"]
      assert:
        op: gte
        args: ["?observed", 0]
