# Canonical Decision Lab data. Rules are data, never executable code.
format: evidence-review/1
module:
  id: review-gift-kit-flexible-evidence
  version: "2.0.0"
  title: Review gift-kit records
  description: "A fictional campaign review: interpret scoped checks, compare complete corrective arrangements, and finish before the handoff cutoff."
  question: "What corrections do these gift-kit checks establish?"
  boundary: Only the published configurations and check predictions for one exact batch and journey revision.
  assumptions: [Current scoped reports are treated as accurate under the author-declared possible outcomes., "All declared joint fault configurations remain possible until excluded by reports; none has an implied probability.", An unreadable printed code can conceal its destination. Planned corrections do not establish successful completion., "Input acceptance records a named role judgment; it does not authenticate identity or issue permission."]
  parameters:
    - id: nowMinute
      type: integer
      min: 0
      label: Review time in whole minutes from the declared origin
  relations:
    - id: expectedScope
      source: basis
      columns:
        - id: field
          type: string
        - id: value
          type: string
      key: [field]
    - id: state
      source: basis
      columns:
        - id: id
          type: string
        - id: label
          type: string
      key: [id]
    - id: stateFault
      source: basis
      columns:
        - id: state
          type: string
        - id: fault
          type: string
      key: [state, fault]
    - id: stateCorrection
      source: basis
      columns:
        - id: state
          type: string
        - id: correction
          type: string
      key: [state, correction]
    - id: checkOutcome
      source: basis
      columns:
        - id: check
          type: string
        - id: outcome
          type: string
      key: [check, outcome]
    - id: prediction
      source: basis
      columns:
        - id: state
          type: string
        - id: check
          type: string
        - id: outcome
          type: string
      key: [state, check, outcome]
    - id: correction
      source: basis
      columns:
        - id: id
          type: string
      key: [id]
    - id: observation
      source: evidence
      columns:
        - id: id
          type: string
        - id: check
          type: string
        - id: outcome
          type: string
        - id: observed
          type: integer
        - id: source
          type: string
        - id: person
          type: string
        - id: text
          type: string
      key: [id]
    - id: recordScope
      source: evidence
      columns:
        - id: record
          type: string
        - id: field
          type: string
        - id: value
          type: string
      key: [record, field]
    - id: wrongScope
      source: derived
      columns:
        - id: record
          type: string
    - id: futureRecord
      source: derived
      columns:
        - id: record
          type: string
    - id: usedRecord
      source: derived
      columns:
        - id: record
          type: string
        - id: check
          type: string
        - id: outcome
          type: string
    - id: recordDisposition
      source: derived
      columns:
        - id: record
          type: string
        - id: disposition
          type: string
        - id: code
          type: string
        - id: reason
          type: string
    - id: stateMismatch
      source: derived
      columns:
        - id: state
          type: string
        - id: record
          type: string
        - id: check
          type: string
        - id: outcome
          type: string
    - id: ruledOutState
      source: derived
      columns:
        - id: state
          type: string
    - id: remainingState
      source: derived
      columns:
        - id: state
          type: string
        - id: label
          type: string
    - id: possibleCorrection
      source: derived
      columns:
        - id: correction
          type: string
    - id: absentCorrection
      source: derived
      columns:
        - id: correction
          type: string
    - id: variableCorrection
      source: derived
      columns:
        - id: correction
          type: string
    - id: requiredCorrection
      source: derived
      columns:
        - id: correction
          type: string
    - id: hasRemainingState
      source: derived
      columns:
        - id: value
          type: boolean
    - id: correctionsEstablished
      source: derived
      columns:
        - id: value
          type: boolean
  rules:
    - id: RECORD.SCOPE.MISSING
      head:
        relation: wrongScope
        args: ["?record"]
      body:
        - relation: observation
          args: ["?record", "?check", "?outcome", "?observed", "?source", "?person", "?text"]
        - relation: expectedScope
          args: ["?field", "?expected"]
        - op: notExists
          atom:
            relation: recordScope
            args: ["?record", "?field", "?expected"]
    - id: RECORD.SCOPE.EXTRA
      head:
        relation: wrongScope
        args: ["?record"]
      body:
        - relation: recordScope
          args: ["?record", "?field", "?value"]
        - op: notExists
          atom:
            relation: expectedScope
            args: ["?field", "?value"]
    - id: RECORD.FUTURE
      head:
        relation: futureRecord
        args: ["?record"]
      body:
        - relation: observation
          args: ["?record", "?check", "?outcome", "?observed", "?source", "?person", "?text"]
        - op: gt
          args:
            - "?observed"
            - parameter: nowMinute
    - id: RECORD.USED
      head:
        relation: usedRecord
        args: ["?record", "?check", "?outcome"]
      body:
        - relation: observation
          args: ["?record", "?check", "?outcome", "?observed", "?source", "?person", "?text"]
        - op: notExists
          atom:
            relation: wrongScope
            args: ["?record"]
        - op: notExists
          atom:
            relation: futureRecord
            args: ["?record"]
    - id: RECORD.WRONG.SCOPE.DISPOSITION
      head:
        relation: recordDisposition
        args: ["?record", ignored, wrong-scope, "The record describes a different batch, revision, device or account scope."]
      body:
        - relation: wrongScope
          args: ["?record"]
    - id: RECORD.FUTURE.DISPOSITION
      head:
        relation: recordDisposition
        args: ["?record", ignored, future-observation, The reported observation is later than the explicit review time.]
      body:
        - relation: futureRecord
          args: ["?record"]
        - op: notExists
          atom:
            relation: wrongScope
            args: ["?record"]
    - id: RECORD.USED.DISPOSITION
      head:
        relation: recordDisposition
        args: ["?record", used, current-scoped-report, The report is used under the published check predictions for this exact scope.]
      body:
        - relation: usedRecord
          args: ["?record", "?check", "?outcome"]
    - id: STATE.REPORT.MISMATCH
      head:
        relation: stateMismatch
        args: ["?state", "?record", "?check", "?outcome"]
      body:
        - relation: state
          args: ["?state", "?label"]
        - relation: usedRecord
          args: ["?record", "?check", "?outcome"]
        - op: notExists
          atom:
            relation: prediction
            args: ["?state", "?check", "?outcome"]
    - id: STATE.RULED.OUT
      head:
        relation: ruledOutState
        args: ["?state"]
      body:
        - relation: stateMismatch
          args: ["?state", "?record", "?check", "?outcome"]
    - id: STATE.REMAINS
      head:
        relation: remainingState
        args: ["?state", "?label"]
      body:
        - relation: state
          args: ["?state", "?label"]
        - op: notExists
          atom:
            relation: ruledOutState
            args: ["?state"]
    - id: CORRECTION.POSSIBLE
      head:
        relation: possibleCorrection
        args: ["?correction"]
      body:
        - relation: remainingState
          args: ["?state", "?label"]
        - relation: stateCorrection
          args: ["?state", "?correction"]
    - id: CORRECTION.ABSENT
      head:
        relation: absentCorrection
        args: ["?correction"]
      body:
        - relation: remainingState
          args: ["?state", "?label"]
        - relation: correction
          args: ["?correction"]
        - op: notExists
          atom:
            relation: stateCorrection
            args: ["?state", "?correction"]
    - id: CORRECTION.VARIES
      head:
        relation: variableCorrection
        args: ["?correction"]
      body:
        - relation: possibleCorrection
          args: ["?correction"]
        - relation: absentCorrection
          args: ["?correction"]
    - id: BASIS.NONEMPTY
      head:
        relation: hasRemainingState
        args: [true]
      body:
        - relation: remainingState
          args: ["?state", "?label"]
    - id: CORRECTIONS.ESTABLISHED
      head:
        relation: correctionsEstablished
        args: [true]
      body:
        - relation: hasRemainingState
          args: [true]
        - op: notExists
          atom:
            relation: variableCorrection
            args: ["?correction"]
    - id: CORRECTION.REQUIRED
      head:
        relation: requiredCorrection
        args: ["?correction"]
      body:
        - relation: correctionsEstablished
          args: [true]
        - relation: possibleCorrection
          args: ["?correction"]
  admission:
    - id: SCOPE.REQUIRED.0
      label: Declare the current batchId
      when: []
      assert:
        op: exists
        atom:
          relation: expectedScope
          args: [batchId, "?value"]
    - id: SCOPE.REQUIRED.1
      label: Declare the current insertRevision
      when: []
      assert:
        op: exists
        atom:
          relation: expectedScope
          args: [insertRevision, "?value"]
    - id: SCOPE.REQUIRED.2
      label: Declare the current destinationRevision
      when: []
      assert:
        op: exists
        atom:
          relation: expectedScope
          args: [destinationRevision, "?value"]
    - id: SCOPE.REQUIRED.3
      label: Declare the current checkoutRevision
      when: []
