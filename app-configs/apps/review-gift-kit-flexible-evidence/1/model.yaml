        label: Reports ruling out fault combinations
        relation: stateMismatch
        columns: [state, record, check, outcome]
      - id: corrections-established
        label: "Do the remaining combinations require the same corrections?"
        relation: correctionsEstablished
        columns: [value]
      - id: required-corrections
        label: The complete established correction set
        relation: requiredCorrection
        columns: [correction]
