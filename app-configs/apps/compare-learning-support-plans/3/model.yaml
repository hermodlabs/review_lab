  "case": {
    "id": "fictional-sam-support",
    "title": "Fictional support comparison for Sam, age eight",
    "scope": "Sam is a fictional eight-year-old whose dyslexia and ADHD have already been professionally assessed. Lisa, the support coordinator, is helping the child, family and professionals choose his next six-week support block. His teacher sees improved participation while unfamiliar words remain difficult to decode. A single reassuring “working” judgment could renew a plan without addressing that remaining difficulty. The comparison keeps both needs and the child’s and family’s burden visible. Compare the next six-week support block for a fictional eight-year-old whose dyslexia and ADHD have already been professionally assessed. A positive classroom report can coexist with persistent decoding difficulty; renewing support on one overall success judgment could leave another need insufficiently addressed. Every response range is an authored assumption, not a validated prediction or a confidence interval. The classroom package is support for attention-related difficulties, not a complete clinical ADHD treatment. Separate progress measures inform reconsideration; before-and-after change alone does not establish a causal effect.",
    "sources": [
      {
        "id": "fictional-response-assumptions",
        "label": "Authored fictional response assumptions",
