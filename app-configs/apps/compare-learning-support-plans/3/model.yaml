        "citation": "Teaching fixture in model.mjs; no individual response values are derived from a study.",
        "applicabilityStatus": "accepted",
        "applicability": "Accepted only as explicit assumptions for this fictional exercise. A real use needs qualified evidence and a documented applicability judgment for the child, support and outcome."
      },
      {
        "id": "trial-context",
        "label": "Research context: distinct reading and ADHD outcomes",
        "kind": "research",
        "citation": "Tamm et al., 2017. Comparing Treatments for Children with ADHD and Word Reading Difficulties: A Randomized Clinical Trial. https://pubmed.ncbi.nlm.nih.gov/28333510/",
        "applicabilityStatus": "uncertain",
        "applicability": "Context for separating target outcomes, not a source of the fictional ranges. The trial ADHD treatment included medication and parent training; it does not validate this classroom-only package or predict this child’s response."
      }
