    reports:
      answer:
        title: Inquiry finding
        question: "Which firms belong on this traceability inquiry list, and whose inclusion is still uncertain?"
        description: See which firms are included under every remaining explanation and whose inclusion still depends on the incident explanation.
      interpretations:
        title: Possible incident explanations
        question: "Which explanations fit, and which firms does each explanation reach?"
        description: Compare the permitted explanations and inspect the tracing inquiry list derived from each one.
      stability:
        title: Why the finding holds
        question: "Would the firm still be included under a different compatible incident explanation?"
        description: Inspect agreeing or opposing explanations under the same submitted record.
      findings:
        title: Conflicts and input checks
        question: "Which explanations were ruled out, and does the submitted information need attention?"
        description: "Review invalid references, incompatible evidence and excluded explanations."
      basis:
        title: Scope and assumptions
        question: "Which catalog, tracing assumptions and alternatives support this finding?"
        description: Inspect the exact case and the limits of the model before applying the result.
      changes:
        title: Effect of case changes
        question: "How did a catalog, evidence or question change affect the inquiry finding?"
        description: Compare recomputed findings while preserving each earlier input basis.
    tableGroups:
      - id: incident-explanation
        title: Product and role explanation
        description: "These are possible incident explanations, rather than choices the reviewer can make true."
        tableIds: [active]
        when:
          parameter: seedMode
          equals: hypothesis
      - id: candidate-inquiry
        title: Firms to consider under this explanation
        description: The inquiry list includes its starting firms. Firm and state totals count distinct identities.
        tableIds: [seeds, inquiry, counts]
      - id: recall-comparisons
        title: Each recall and their overlap
        description: Keep each stipulated recall origin and its product-specific downstream trace separate before comparing the results.
        tableIds: [recall-forward, recall-downstream, trace-intersections]
        when:
          parameter: seedMode
          equals: stipulated
      - id: catalog-overlap
        title: Catalog overlap
        description: Handling both products is a different question from being downstream of both recall starting points.
        tableIds: [catalog-intersections]
        collapsed: true
      - id: downstream-tracing
        title: Downstream tracing
        description: Follow outgoing product-specific potential connections. Downstream firm lists exclude the inquiry starting firms.
        tableIds: [forward, direct, downstream]
        collapsed: true
      - id: upstream-tracing
        title: Upstream tracing
        description: Follow the same potential connections backward. Upstream firm lists exclude the inquiry starting firms.
        tableIds: [backward, upstream]
        collapsed: true
      - id: regional-summary
        title: Combined trace and regional summary
        description: Combine distinct upstream and downstream firms before counting states or filtering the reporting region.
        tableIds: [union, states, regional]
        collapsed: true
    findingGroups:
      - id: firm-inclusion
        title: Firm inclusion
        question: "Which firms belong on this traceability inquiry list, and whose inclusion is still uncertain?"
        description: Review the selected firm and comparison firms without treating an open inclusion question as settled.
        queryIds: [target-in-inquiry, inquiry-F11, inquiry-F09, inquiry-F01, inquiry-F12]
      - id: product-role-identification
        title: Product and role identification
        question: "Which product and business role may explain this incident?"
        description: A firm can belong on the inquiry list even while the product and business-role explanation remains open.
        queryIds: [active-hypotheses]
      - id: recall-comparison-findings
        title: Recall comparisons
        question: "Which firms handle both products, and which are downstream of both recalls?"
        description: Keep catalog overlap separate from the intersection of two product-specific recall traces.
        queryIds: [concurrent-catalog-intersections, concurrent-trace-intersections]
        when:
          parameter: seedMode
          equals: stipulated
