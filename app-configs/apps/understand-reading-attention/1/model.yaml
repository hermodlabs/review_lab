        "columns": [
          {
            "id": "domain",
            "type": "string"
          },
          {
            "id": "status",
            "type": "string"
          }
        ]
      },
      {
        "id": "supportedConclusion",
        "source": "derived",
        "columns": [
          {
            "id": "domain",
            "type": "string"
          },
          {
            "id": "label",
            "type": "string"
          }
        ]
      },
      {
        "id": "assessmentBoundary",
        "source": "derived",
        "columns": [
          {
            "id": "id",
            "type": "string"
          },
          {
