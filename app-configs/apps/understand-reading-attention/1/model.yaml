{
  "format": "evidence-review/1",
  "module": {
    "id": "reading-attention-evidence",
    "version": "1.0.0",
    "title": "Understand reading and attention findings",
    "description": "Review a bounded fictional record before turning poor grades into an either-or explanation. Separate what has been professionally recorded from what remains unassessed.",
    "question": "What do the current assessment records establish about this child’s reading and attention difficulties, and what still needs assessment?",
    "boundary": "A fictional record-review example, not a diagnostic instrument. The finite catalogue describes possible professionally recorded reading and attention assessment conclusions, including coexistence and uncharacterized concerns. It is not an exhaustive catalogue of causes of poor grades. Only explicitly accepted, current records for the declared child, assessment episode and context constrain those possibilities. Logical agreement does not authenticate a record, establish clinical validity, attribute the cause of grades, prescribe support or estimate diagnostic probabilities.",
    "parameters": [],
    "relations": [
      {
        "id": "expectedScope",
        "source": "basis",
        "columns": [
          {
            "id": "field",
            "type": "string"
          },
          {
            "id": "value",
            "type": "string"
          }
        ],
        "key": [
          "field"
        ]
      },
      {
        "id": "possibility",
        "source": "basis",
        "columns": [
          {
            "id": "id",
            "type": "string"
          },
          {
            "id": "label",
            "type": "string"
          },
          {
            "id": "reading",
            "type": "string"
          },
          {
            "id": "attention",
            "type": "string"
          }
        ],
        "key": [
          "id"
        ]
      },
      {
        "id": "assessmentDomain",
        "source": "basis",
        "columns": [
          {
            "id": "id",
            "type": "string"
          },
          {
            "id": "label",
            "type": "string"
          }
        ],
        "key": [
          "id"
        ]
      },
      {
        "id": "concern",
        "source": "evidence",
        "columns": [
          {
            "id": "id",
            "type": "string"
          },
          {
            "id": "domain",
            "type": "string"
          },
          {
            "id": "description",
            "type": "string"
          },
          {
            "id": "source",
            "type": "string"
          },
          {
            "id": "observedDay",
            "type": "integer"
          }
        ],
        "key": [
          "id"
        ]
      },
      {
        "id": "finding",
        "source": "evidence",
        "columns": [
          {
            "id": "id",
            "type": "string"
          },
          {
            "id": "domain",
            "type": "string",
            "references": {
              "relation": "assessmentDomain",
              "column": "id"
            }
          },
          {
            "id": "status",
            "type": "string"
          },
          {
            "id": "professional",
            "type": "string"
          },
          {
            "id": "source",
            "type": "string"
          },
          {
            "id": "observedDay",
            "type": "integer"
          },
          {
            "id": "currentStatus",
            "type": "string"
          },
          {
            "id": "accepted",
            "type": "boolean"
          }
        ],
        "key": [
          "id"
        ]
      },
      {
        "id": "recordScope",
        "source": "evidence",
        "columns": [
          {
            "id": "record",
            "type": "string",
            "references": {
              "relation": "finding",
              "column": "id"
            }
          },
          {
            "id": "field",
            "type": "string"
          },
          {
            "id": "value",
            "type": "string"
          }
        ],
        "key": [
          "record",
          "field"
        ]
      },
      {
        "id": "candidate",
        "source": "assignment",
        "columns": [
          {
            "id": "id",
            "type": "string"
          }
        ]
      },
      {
        "id": "wrongScope",
        "source": "derived",
        "columns": [
          {
            "id": "record",
            "type": "string"
          }
        ]
      },
      {
        "id": "usableFinding",
        "source": "derived",
        "columns": [
          {
            "id": "record",
            "type": "string"
          },
          {
            "id": "domain",
            "type": "string"
          },
          {
            "id": "status",
            "type": "string"
          },
          {
            "id": "professional",
            "type": "string"
          },
          {
            "id": "source",
            "type": "string"
          }
        ]
      },
      {
        "id": "selectedProfile",
        "source": "derived",
        "columns": [
          {
            "id": "id",
