  provenance:
    - id: marble-paper-C0
      kind: synthetic-stipulation
      source: Can_We_Complete_the_Commitment.pdf
      pages: "2-10, 19-21"
      meaning: "Hypothetical instruction, operating scope, workers, grants, service offerings, common clock, timing grids and fees. These are declarations rather than observations of real delivery operations."
    - id: reviewed-E3
      kind: sdk-reviewed-state-projection
      source: marble.basis.json
      meaning: "The public evidence-review/1 SDK evaluated the existing E3 fixture. Its admitted heavy identities populate the explicit joint scenario rows; no preferred bag or feasible-plan flag is supplied."
      limitations: "This is a pinned, accepted projection for the milestone-1 draft, not an implemented automatic dependency bridge or support for the paper’s older evidence-case/2 envelope."
    - id: joint-domain
      kind: synthetic-stipulation
      source: Can_We_Complete_the_Commitment.pdf
      pages: "10"
      meaning: All six listed r1/r2/r3 and clear/delay combinations are admitted. No independence or probability claim is inferred from enumeration.
    - id: marble-static-boundary
      kind: scope-exclusion
      source: Can_We_Complete_the_Commitment.pdf
      pages: "11-12"
      meaning: "The conditional-policy supplement, reliable time-1 signal, budget 8 and blue branch are excluded. No observation-dependent action is supported by this draft."
