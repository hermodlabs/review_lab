# Canonical Decision Lab data. Rules are data, never executable code.
format: complete-a-commitment/1
module:
  id: marble-bag-delivery
  title: Plan marble delivery
  description: "Can one complete plan deliver the whole bag containing the heavy marble, sealed and accompanied by its identifying record, within the accepted receipt and prepaid expense limits?"
  question: "Can we complete the whole-bag delivery?"
  template:
    id: complete-a-commitment
    version: 1
  units:
    time: synthetic tick
    money: hypothetical dollar
    count: unit of resource capacity
    timeOrigin: tick 0 of the accepted operating snapshot
  assumptions: ["This draft is a static, finite planning model. Every activity in a complete plan must be performed; task assignments cannot branch on a future observation.", "Packing means packing and sealing one selected whole bag. Record preparation produces the identifying record that accompanies that same bag; no further work is required in this stipulated fixture.", All modeled intervals use the common OPS-1 clock and are half-open. Adjacent intervals may share a boundary without overlapping., "The nine listed marble memberships and masses remain stable. Transporting a sealed bag preserves its contents. Receipt occurs at modeled arrival; no loss, damage or unlisted work is modeled.", "The accepted E3 evidence review supplies factual alternatives, not controllable choices. All six listed heavy-identity and travel-condition combinations are admitted; their rows assert no probabilities.", "Every listed worker has capacity one. Packing additionally uses the single bench; preparing the record uses the separate single desk. The bench reservation is fixed.", The packing-grant registry is complete within this fixture. An absent matching full-interval grant means no usable packing permission. Record preparation requires its declared capability and no separate grant., "Service durations are deterministic conditional on the listed travel condition. Each modeled task fee and service fee is prepaid. No borrowing, separate refundable hold or time-indexed cash constraint is modeled.", The timing grids and listed entities bound the candidate domain. Passing this calculation neither grants authority nor books workers or transport., "The paper’s reliable-signal conditional-policy supplement is excluded from this first static-plan draft."]
  inputs:
    parameters:
      owner:
        type: string
      recipient:
        type: string
      inventory:
        type: string
      snapshot:
        type: string
      deadline:
        type: integer
        unit: time
        minimum: 0
      expenseLimit:
        type: integer
        unit: money
        minimum: 0
      receiptOpen:
        type: integer
        unit: time
        minimum: 0
      receiptClose:
        type: integer
        unit: time
        minimum: 0
      packDuration:
        type: integer
        unit: time
        exclusiveMinimum: 0
      recordDuration:
        type: integer
        unit: time
        exclusiveMinimum: 0
      packStarts:
        type: array
        items:
          type: integer
          unit: time
          minimum: 0
      recordStarts:
        type: array
        items:
          type: integer
          unit: time
          minimum: 0
      departures:
        type: array
        items:
          type: integer
          unit: time
          minimum: 0
    tables:
      bags:
        key: [id]
        columns:
          id:
            type: string
          label:
            type: string
          inventory:
            type: string
      marbles:
        key: [id]
        columns:
          id:
            type: string
          bag:
            type: string
            references:
              table: bags
              column: id
          inventory:
            type: string
      workers:
        key: [id]
        columns:
          id:
            type: string
            references:
              table: resources
              column: id
          fee:
            type: integer
            unit: money
            minimum: 0
      workerCapabilities:
        key: [worker, action]
        columns:
          worker:
            type: string
            references:
              table: workers
              column: id
          action:
            type: string
      workerAvailability:
        key: [worker, start, end]
        columns:
          worker:
            type: string
            references:
              table: workers
              column: id
          start:
            type: integer
            unit: time
            minimum: 0
          end:
            type: integer
            unit: time
            minimum: 0
      resources:
        key: [id]
        columns:
          id:
            type: string
          capacity:
            type: integer
            unit: count
            minimum: 0
      bookings:
        key: [id]
        columns:
          id:
            type: string
          resource:
            type: string
            references:
              table: resources
              column: id
          start:
            type: integer
            unit: time
            minimum: 0
          end:
            type: integer
            unit: time
            minimum: 0
          amount:
            type: integer
            unit: count
            minimum: 0
      grants:
        key: [id]
        columns:
          id:
            type: string
          actor:
            type: string
            references:
              table: workers
              column: id
          action:
            type: string
          bag:
            type: string
            references:
              table: bags
              column: id
          start:
            type: integer
            unit: time
            minimum: 0
          end:
            type: integer
            unit: time
            minimum: 0
      services:
        key: [id]
        columns:
          id:
            type: string
          fee:
            type: integer
            unit: money
            minimum: 0
      serviceDepartures:
        key: [service, time]
        columns:
          service:
            type: string
            references:
              table: services
              column: id
          time:
            type: integer
            unit: time
            minimum: 0
      conditions:
        key: [id]
        columns:
          id:
            type: string
      travel:
        key: [service, condition]
        columns:
          service:
            type: string
            references:
              table: services
              column: id
          condition:
            type: string
            references:
              table: conditions
              column: id
          duration:
            type: integer
            unit: time
            exclusiveMinimum: 0
      scenarios:
        key: [id]
        columns:
          id:
            type: string
          heavy:
            type: string
            references:
              table: marbles
              column: id
          condition:
            type: string
            references:
              table: conditions
              column: id
  lookupCoverage:
    - table: travel
      keys:
        service:
          domain:
            table: services
            column: id
        condition:
          domain:
            table: conditions
            column: id
  choices:
    - id: bag
      domain:
        table: bags
        column: id
    - id: packWorker
      domain:
        table: workers
        column: id
    - id: recordWorker
      domain:
        table: workers
        column: id
    - id: packStart
      domain:
        parameter: packStarts
    - id: recordStart
      domain:
        parameter: recordStarts
    - id: service
      domain:
        table: services
        column: id
    - id: departure
      domain:
        parameter: departures
  scenarioDomain:
    table: scenarios
  derived:
    - id: travelDuration
      type: integer
      unit: time
      expr:
        op: lookup
        table: travel
        where:
          service:
            ref: choice.service
          condition:
            ref: scenario.condition
        column: duration
    - id: arrival
      type: integer
      unit: time
      expr:
        op: add
        args:
          - ref: choice.departure
          - ref: derived.travelDuration
  activities:
    - id: pack
      actor:
        ref: choice.packWorker
      start:
        ref: choice.packStart
      duration:
        ref: parameter.packDuration
      resources:
        - resource:
            ref: choice.packWorker
          amount:
            literal: 1
        - resource:
            literal: bench
          amount:
            literal: 1
    - id: record
      actor:
        ref: choice.recordWorker
      start:
        ref: choice.recordStart
      duration:
        ref: parameter.recordDuration
      resources:
        - resource:
            ref: choice.recordWorker
          amount:
            literal: 1
        - resource:
            literal: desk
          amount:
            literal: 1
  resources:
    definitions:
      table: resources
      idColumn: id
      capacityColumn: capacity
    bookings:
      table: bookings
      resourceColumn: resource
      startColumn: start
      endColumn: end
      amountColumn: amount
  requirements:
    - id: SUFFICIENCY
      label: Correct whole bag
      meaning: "Deliver the selected whole bag, which contains the heavy marble under each admitted factual state. Packing seals it; its completed identifying record accompanies it."
      waivable: false
    - id: RESOURCES
      label: Workers and workspaces
      meaning: "Each assigned worker has the required capability and full task availability. Combined worker, bench and desk demands respect capacity and fixed bookings."
      waivable: false
    - id: TIME
      label: Ready and received in time
      meaning: "Packing and record preparation both finish before dispatch; receipt occurs by the accepted deadline in every admitted travel condition."
      waivable: false
    - id: AUTHORITY
      label: Packing permission
      meaning: "A grant for the same worker, selected bag and pack action covers the entire packing interval in the stipulated complete registry."
      waivable: false
    - id: ACCESS
      label: Dispatch and receipt access
      meaning: "The chosen service offers the selected dispatch time and arrival is within the recipient’s half-open access window."
      waivable: false
    - id: COST
      label: Prepaid expense
      meaning: Both task fees and the service fee together stay within the accepted prepaid expense limit.
      waivable: false
  constraints:
    - id: contains-heavy-marble
      requirement: SUFFICIENCY
      kind: predicate
      predicate:
        op: exists
        table: marbles
        where:
          id:
            ref: scenario.heavy
          bag:
            ref: choice.bag
          inventory:
            ref: parameter.inventory
    - id: bag-in-scope
      requirement: SUFFICIENCY
      kind: predicate
      predicate:
        op: exists
        table: bags
        where:
          id:
            ref: choice.bag
          inventory:
            ref: parameter.inventory
    - id: pack-capability
      requirement: RESOURCES
      kind: predicate
      predicate:
        op: exists
        table: workerCapabilities
        where:
          worker:
            ref: choice.packWorker
          action:
            literal: pack
    - id: record-capability
      requirement: RESOURCES
      kind: predicate
      predicate:
        op: exists
        table: workerCapabilities
        where:
          worker:
            ref: choice.recordWorker
          action:
            literal: record
    - id: pack-availability
      requirement: RESOURCES
      kind: predicate
      predicate:
        op: interval-covered
        table: workerAvailability
        where:
          worker:
            ref: activity.pack.actor
        start:
          ref: activity.pack.start
        end:
          ref: activity.pack.end
        startColumn: start
        endColumn: end
    - id: record-availability
      requirement: RESOURCES
      kind: predicate
      predicate:
        op: interval-covered
        table: workerAvailability
        where:
          worker:
            ref: activity.record.actor
        start:
          ref: activity.record.start
        end:
          ref: activity.record.end
        startColumn: start
        endColumn: end
    - id: combined-resource-capacity
      requirement: RESOURCES
      kind: resource-capacity
    - id: pack-before-dispatch
      requirement: TIME
      kind: predicate
      predicate:
        op: lte
        args:
          - ref: activity.pack.end
          - ref: choice.departure
    - id: record-before-dispatch
      requirement: TIME
      kind: predicate
      predicate:
        op: lte
        args:
          - ref: activity.record.end
          - ref: choice.departure
    - id: receipt-by-deadline
      requirement: TIME
      kind: predicate
      predicate:
        op: lte
        args:
          - ref: derived.arrival
          - ref: parameter.deadline
    - id: scoped-packing-grant
      requirement: AUTHORITY
      kind: predicate
      predicate:
        op: exists
        table: grants
        where:
          actor:
            ref: choice.packWorker
          bag:
            ref: choice.bag
          action:
            literal: pack
        test:
          op: and
          args:
            - op: lte
              args:
                - ref: row.start
                - ref: activity.pack.start
            - op: gte
              args:
                - ref: row.end
                - ref: activity.pack.end
    - id: offered-dispatch
      requirement: ACCESS
      kind: predicate
      predicate:
        op: exists
        table: serviceDepartures
        where:
          service:
            ref: choice.service
          time:
            ref: choice.departure
    - id: receipt-window
      requirement: ACCESS
      kind: predicate
      predicate:
        op: and
        args:
          - op: lte
            args:
              - ref: parameter.receiptOpen
              - ref: derived.arrival
          - op: lt
            args:
              - ref: derived.arrival
              - ref: parameter.receiptClose
    - id: prepaid-expense-limit
      requirement: COST
      kind: predicate
      predicate:
        op: lte
        args:
          - ref: finance.expense
          - ref: parameter.expenseLimit
  finance:
    mode: expense
    charges:
      - id: packing-fee
        amount:
          op: lookup
          table: workers
          where:
            id:
              ref: choice.packWorker
          column: fee
      - id: record-fee
        amount:
          op: lookup
          table: workers
          where:
            id:
              ref: choice.recordWorker
          column: fee
      - id: delivery-fee
        amount:
          op: lookup
          table: services
          where:
            id:
              ref: choice.service
          column: fee
    holds: []
  preference:
    direction: min
    expression:
      ref: finance.expense
    then:
      - direction: min
        expression:
          op: worst-case
          expression:
            ref: derived.arrival
  labels:
    plan: Delivery plan
    object: Whole bag
    actor: Worker
    service: Delivery service
    departure: Dispatch
    arrival: Receipt
    expense: Prepaid expense
    activity.pack: Pack and seal the selected bag
    activity.record: Prepare its identifying record
    resource.bench: Packing bench
    resource.desk: Record desk
    scenario.heavy: Possible heavy marble
    scenario.condition: Travel condition
    input.owner: Decision owner
    input.recipient: Recipient
    input.snapshot: Operating snapshot
  version: "1.0.0"
  metadata:
    catalog:
      domain:
        id: canonical-examples
        label: Canonical examples
        description: Reference problems for understanding and testing reusable evidence patterns.
      useCase:
        id: deliver-heavy-marble-bag
        label: Deliver the heavy-marble bag
        description: Find a complete plan to deliver the identified bag with its seal and identifying record within the accepted time and expense limits.
