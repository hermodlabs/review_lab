format: complete-a-commitment/1
module:
  id: plan-first-shipment
  title: Plan the first shipment
  description: "Generate complete, static shipment plans from selectable lots, workers, preparation times, release time, carrier and departure. Check each whole plan against every declared readiness and travel scenario before comparing incremental expense. This synthetic operating snapshot does not infer readiness from business records or reserve stock, staff, authority or carrier capacity."
  question: "Can we deliver the complete accepted order within its receipt, expense and cash limits?"
  template:
    id: complete-a-commitment
    version: 1
  units:
    time: synthetic day
    timeOrigin: Day 0 is the agreed start of the synthetic shipment-planning snapshot.
    money: hypothetical USD
    count: unit of resource capacity
    quantity: case
  assumptions: ["All firms, orders, lots, permissions, calendars, prices, holds and operating states are synthetic declarations.", "The accepted commitment fixes order revision, exact product revisions and quantities, recipient, prepaid terms, receipt window, deadline, expense limit and cash limit. A changed promise is a revised commitment.", "Each order line draws its entire quantity from one existing lot. Both selected lots must share one origin. Splits, transfers, production, replenishment and simultaneous multi-order allocation are outside this profile.", "The stock ledger, issued-grant registry, calendars, readiness declarations and carrier offerings remain stable over this planning horizon. Unlisted bookings and grants are absent from their stipulated complete registries.", Workers with the declared capabilities may pack or prepare the record at either site without travel or setup time. Record preparation is remote. The declared release officer may attend the sole release operation at either site. There are no other desk conflicts or equipment needs., "Tasks occupy half-open intervals. Packing and record preparation may proceed independently; both finish before final release, and final release finishes before departure.", "A service offering declares capacity available to the proposed booking; computing a passing plan does not create an external reservation or authorization.", Receipt occurs at arrival. Waiting or off-site staging to accommodate an early arrival is unsupported., "Worker and release charges occur at task starts; handling occurs at packing start; carrier fee and refundable hold occur at booking. The hold returns at arrival. Equal-time events are netted before each cash-balance check.", "Inventory is already owned. Acquisition costs, sales revenue, tax, penalties, borrowing, financing and customer receipts are excluded. Refundable holds affect cash in use and never incremental expense.", "Readiness states are supplied synthetic scoped declarations, not results of canonical evidence inference. No probability is attached to the explicitly listed joint scenarios.", "A single complete static plan is fixed before the scenario is known. Conditional plans, learning policies and new operating scenarios require a later supported capability."]
  inputs:
    parameters:
      owner:
        type: string
      launch:
        type: string
      snapshot:
        type: string
      order:
        type: string
      recipient:
        type: string
      terms:
        type: string
      skuA:
        type: string
      revisionA:
        type: string
      quantityA:
        type: integer
        unit: quantity
        minimum: 1
      skuB:
        type: string
      revisionB:
        type: string
      quantityB:
        type: integer
        unit: quantity
        minimum: 1
      deadline:
        type: number
        unit: time
        minimum: 0
      receiptOpen:
        type: number
        unit: time
        minimum: 0
      receiptClose:
        type: number
        unit: time
        minimum: 0
      expenseLimit:
        type: number
        unit: money
        minimum: 0
      cashLimit:
        type: number
        unit: money
        minimum: 0
      bookingTime:
        type: number
        unit: time
        minimum: 0
      releaseActor:
        type: string
        references:
          table: workers
          column: id
      packDuration:
        type: number
        unit: time
        exclusiveMinimum: 0
      recordDuration:
        type: number
        unit: time
        exclusiveMinimum: 0
      releaseDuration:
        type: number
        unit: time
        exclusiveMinimum: 0
      lotAChoices:
        type: array
        items:
          type: string
          references:
            table: lots
            column: id
      lotBChoices:
        type: array
        items:
          type: string
          references:
            table: lots
            column: id
      workerChoices:
        type: array
        items:
          type: string
          references:
            table: workers
            column: id
      packStarts:
        type: array
        items:
          type: integer
          unit: time
          minimum: 0
      recordStarts:
        type: array
        items:
          type: integer
          unit: time
          minimum: 0
      releaseStarts:
        type: array
        items:
          type: integer
          unit: time
          minimum: 0
      departures:
        type: array
        items:
          type: integer
          unit: time
          minimum: 0
    tables:
      sites:
        key: [id]
        columns:
          id:
            type: string
          handlingFee:
            type: number
            unit: money
            minimum: 0
      lots:
        key: [id]
        columns:
          id:
            type: string
          sku:
            type: string
          revision:
            type: string
          origin:
            type: string
            references:
              table: sites
              column: id
          onHand:
            type: integer
            unit: quantity
            minimum: 0
          committed:
            type: integer
            unit: quantity
            minimum: 0
      workers:
        key: [id]
        columns:
          id:
            type: string
          fee:
            type: number
            unit: money
            minimum: 0
      capabilities:
        key: [actor, task]
        columns:
          actor:
            type: string
            references:
              table: workers
              column: id
          task:
            type: string
      calendars:
        key: [actor, start, end]
        columns:
          actor:
            type: string
            references:
              table: workers
              column: id
          start:
            type: number
            unit: time
            minimum: 0
          end:
            type: number
            unit: time
            minimum: 0
      resources:
        key: [id]
        columns:
          id:
            type: string
          capacity:
            type: number
            unit: count
            minimum: 0
      bookings:
        key: [id]
        columns:
          id:
            type: string
          resource:
            type: string
            references:
              table: resources
              column: id
          start:
            type: number
            unit: time
            minimum: 0
          end:
            type: number
            unit: time
            minimum: 0
          amount:
            type: number
            unit: count
            minimum: 0
      grants:
        key: [id]
        columns:
          id:
            type: string
          actor:
            type: string
            references:
              table: workers
              column: id
          action:
            type: string
          origin:
            type: string
            references:
              table: sites
              column: id
          order:
            type: string
          recipient:
            type: string
          terms:
            type: string
          start:
            type: number
            unit: time
            minimum: 0
          end:
            type: number
            unit: time
            minimum: 0
      services:
        key: [id]
        columns:
          id:
            type: string
          fee:
            type: number
            unit: money
            minimum: 0
          hold:
            type: number
            unit: money
            minimum: 0
          capacity:
            type: integer
            unit: quantity
            minimum: 0
          bookingTime:
            type: number
            unit: time
            minimum: 0
      serviceOrigins:
        key: [service, origin]
        columns:
          service:
            type: string
            references:
              table: services
              column: id
          origin:
            type: string
            references:
              table: sites
              column: id
      serviceDepartures:
        key: [service, departure]
        columns:
          service:
            type: string
            references:
              table: services
              column: id
          departure:
            type: number
            unit: time
            minimum: 0
      conditions:
        key: [id]
        columns:
          id:
            type: string
      travel:
        key: [service, condition]
        columns:
          service:
            type: string
            references:
              table: services
              column: id
          condition:
            type: string
            references:
              table: conditions
              column: id
          duration:
            type: number
            unit: time
            minimum: 0
      readinessStates:
        key: [id]
        columns:
          id:
            type: string
      readiness:
        key: [state, origin]
        columns:
          state:
            type: string
            references:
              table: readinessStates
              column: id
          origin:
            type: string
            references:
              table: sites
              column: id
          order:
            type: string
          recipient:
            type: string
          snapshot:
            type: string
          registered:
            type: boolean
          itemsAligned:
            type: boolean
          ediReady:
            type: boolean
      scenarios:
        key: [id]
        columns:
          id:
            type: string
          readinessState:
            type: string
            references:
              table: readinessStates
              column: id
          condition:
            type: string
            references:
              table: conditions
              column: id
  choices:
    - id: lotA
      domain:
        parameter: lotAChoices
    - id: lotB
      domain:
        parameter: lotBChoices
    - id: packWorker
      domain:
        parameter: workerChoices
    - id: recordWorker
      domain:
        parameter: workerChoices
    - id: packStart
      domain:
        parameter: packStarts
    - id: recordStart
      domain:
        parameter: recordStarts
    - id: releaseStart
      domain:
        parameter: releaseStarts
    - id: service
      domain:
        table: services
        column: id
    - id: departure
      domain:
        parameter: departures
  scenarioDomain:
    table: scenarios
  lookupCoverage:
    - table: travel
      keys:
        service:
          domain:
            table: services
            column: id
        condition:
          domain:
            table: scenarios
            column: condition
    - table: readiness
      keys:
        state:
          domain:
            table: scenarios
            column: readinessState
        origin:
          domain:
            table: sites
            column: id
  derived:
    - id: origin
      type: string
      expr:
        op: lookup
        table: lots
        where:
          id:
            ref: choice.lotA
        column: origin
    - id: loadQuantity
      type: integer
      unit: quantity
      expr:
        op: add
        args:
          - ref: parameter.quantityA
          - ref: parameter.quantityB
    - id: arrival
      type: number
      unit: time
      expr:
        op: add
        args:
          - ref: choice.departure
          - op: lookup
            table: travel
            where:
              service:
                ref: choice.service
              condition:
                ref: scenario.condition
            column: duration
  activities:
    - id: pack
      actor:
        ref: choice.packWorker
      start:
        ref: choice.packStart
      duration:
        ref: parameter.packDuration
      resources:
        - resource:
            ref: choice.packWorker
          amount:
            literal: 1
        - resource:
            ref: derived.origin
          amount:
            literal: 1
    - id: record
      actor:
        ref: choice.recordWorker
      start:
        ref: choice.recordStart
      duration:
        ref: parameter.recordDuration
      resources:
        - resource:
            ref: choice.recordWorker
          amount:
            literal: 1
    - id: release
      actor:
        ref: parameter.releaseActor
      start:
        ref: choice.releaseStart
      duration:
        ref: parameter.releaseDuration
      resources:
        - resource:
            ref: parameter.releaseActor
          amount:
            literal: 1
  resources:
    definitions:
      table: resources
      idColumn: id
      capacityColumn: capacity
    bookings:
      table: bookings
      resourceColumn: resource
      startColumn: start
      endColumn: end
      amountColumn: amount
  requirements:
    - id: SUFFICIENCY
      label: Correct and ready load
      meaning: "The exact accepted product revisions and uncommitted quantities form one-origin load, and the selected origin and order satisfy the supplied scoped readiness declarations in every admitted state."
      waivable: false
    - id: RESOURCES
      label: Staff and dock availability
      meaning: "The same assigned actors have the declared capabilities and full-interval availability; their combined schedule and selected dock remain within resource capacity."
      waivable: false
    - id: TIME
      label: Task order and receipt deadline
      meaning: "Preparation precedes release, release precedes departure, and every modeled arrival meets the accepted latest receipt time."
      waivable: false
    - id: AUTHORITY
      label: Authorized release
      meaning: "An issued grant matches the actual actor, action, origin, order revision, recipient and terms and covers the whole release interval."
      waivable: false
    - id: ACCESS
      label: Carrier and recipient access
      meaning: "The offered service accepts the origin, load, booking time and departure; receipt occurs inside the recipient access window without unmodeled waiting."
      waivable: false
    - id: COST
      label: Incremental expense
      meaning: "Nonrefundable task, handling and carrier charges remain within the accepted expense limit."
      waivable: false
    - id: CASH
      label: Cash available before receipt
      meaning: "The maximum time-indexed cash in use, including refundable holds and net equal-time events, remains within available cash in every admitted scenario."
      waivable: false
  constraints:
    - id: SHIP-STOCK-A
      requirement: SUFFICIENCY
      kind: predicate
      predicate:
        op: and
        args:
          - op: eq
            args:
              - op: lookup
                table: lots
                where:
                  id:
                    ref: choice.lotA
                column: sku
              - ref: parameter.skuA
          - op: eq
            args:
              - op: lookup
                table: lots
                where:
                  id:
                    ref: choice.lotA
                column: revision
              - ref: parameter.revisionA
          - op: gte
            args:
              - op: sub
                args:
                  - op: lookup
                    table: lots
                    where:
                      id:
                        ref: choice.lotA
                    column: onHand
                  - op: lookup
                    table: lots
                    where:
                      id:
                        ref: choice.lotA
                    column: committed
              - ref: parameter.quantityA
    - id: SHIP-STOCK-B
      requirement: SUFFICIENCY
      kind: predicate
      predicate:
        op: and
        args:
          - op: eq
            args:
              - op: lookup
                table: lots
                where:
                  id:
                    ref: choice.lotB
                column: sku
              - ref: parameter.skuB
          - op: eq
            args:
              - op: lookup
                table: lots
                where:
                  id:
                    ref: choice.lotB
                column: revision
              - ref: parameter.revisionB
          - op: gte
            args:
              - op: sub
                args:
                  - op: lookup
                    table: lots
                    where:
                      id:
                        ref: choice.lotB
                    column: onHand
                  - op: lookup
                    table: lots
                    where:
                      id:
                        ref: choice.lotB
                    column: committed
              - ref: parameter.quantityB
    - id: SHIP-STOCK-ORIGIN
      requirement: SUFFICIENCY
      kind: predicate
      predicate:
        op: eq
        args:
          - op: lookup
            table: lots
            where:
              id:
                ref: choice.lotB
            column: origin
          - ref: derived.origin
    - id: SHIP-READINESS
      requirement: SUFFICIENCY
      kind: predicate
      predicate:
        op: and
        args:
          - op: eq
            args:
              - op: lookup
                table: readiness
                where:
                  state:
                    ref: scenario.readinessState
                  origin:
                    ref: derived.origin
                column: order
              - ref: parameter.order
          - op: eq
            args:
              - op: lookup
                table: readiness
                where:
                  state:
                    ref: scenario.readinessState
                  origin:
                    ref: derived.origin
                column: recipient
              - ref: parameter.recipient
          - op: eq
            args:
              - op: lookup
                table: readiness
                where:
                  state:
                    ref: scenario.readinessState
                  origin:
                    ref: derived.origin
                column: snapshot
              - ref: parameter.snapshot
          - op: eq
            args:
              - op: lookup
                table: readiness
                where:
                  state:
                    ref: scenario.readinessState
                  origin:
                    ref: derived.origin
                column: registered
              - literal: true
          - op: eq
            args:
              - op: lookup
                table: readiness
                where:
                  state:
                    ref: scenario.readinessState
                  origin:
                    ref: derived.origin
                column: itemsAligned
              - literal: true
          - op: eq
            args:
              - op: lookup
                table: readiness
                where:
                  state:
                    ref: scenario.readinessState
                  origin:
                    ref: derived.origin
                column: ediReady
              - literal: true
    - id: SHIP-WORK-PACK-CAPABILITY
      requirement: RESOURCES
      kind: predicate
      predicate:
        op: exists
        table: capabilities
        where:
          actor:
            ref: choice.packWorker
          task:
            literal: pack
    - id: SHIP-WORK-RECORD-CAPABILITY
      requirement: RESOURCES
      kind: predicate
      predicate:
        op: exists
        table: capabilities
        where:
          actor:
            ref: choice.recordWorker
          task:
            literal: record
    - id: SHIP-WORK-RELEASE-CAPABILITY
      requirement: RESOURCES
      kind: predicate
      predicate:
        op: exists
        table: capabilities
        where:
          actor:
            ref: parameter.releaseActor
          task:
            literal: release
    - id: SHIP-WORK-PACK-WINDOW
      requirement: RESOURCES
      kind: predicate
      predicate:
        op: interval-covered
        table: calendars
        where:
          actor:
            ref: choice.packWorker
        start:
          ref: activity.pack.start
        end:
          ref: activity.pack.end
        startColumn: start
        endColumn: end
    - id: SHIP-WORK-RECORD-WINDOW
      requirement: RESOURCES
      kind: predicate
      predicate:
        op: interval-covered
        table: calendars
        where:
          actor:
            ref: choice.recordWorker
        start:
          ref: activity.record.start
        end:
          ref: activity.record.end
        startColumn: start
        endColumn: end
    - id: SHIP-WORK-RELEASE-WINDOW
      requirement: RESOURCES
      kind: predicate
      predicate:
        op: interval-covered
        table: calendars
        where:
          actor:
            ref: parameter.releaseActor
        start:
          ref: activity.release.start
        end:
          ref: activity.release.end
        startColumn: start
        endColumn: end
    - id: SHIP-WORK-CAPACITY
      requirement: RESOURCES
      kind: resource-capacity
    - id: SHIP-PRE
      requirement: TIME
      kind: predicate
      predicate:
        op: and
        args:
          - op: lte
            args:
              - ref: activity.pack.end
              - ref: activity.release.start
          - op: lte
            args:
              - ref: activity.record.end
              - ref: activity.release.start
          - op: lte
            args:
              - ref: activity.release.end
              - ref: choice.departure
    - id: SHIP-AUTH
      requirement: AUTHORITY
      kind: predicate
      predicate:
        op: exists
        table: grants
        where:
          actor:
            ref: parameter.releaseActor
          action:
            literal: release
          origin:
            ref: derived.origin
          order:
            ref: parameter.order
          recipient:
            ref: parameter.recipient
          terms:
            ref: parameter.terms
        test:
          op: and
          args:
            - op: lte
              args:
                - ref: row.start
                - ref: activity.release.start
            - op: gte
              args:
                - ref: row.end
                - ref: activity.release.end
    - id: SHIP-SERVICE-ORIGIN
      requirement: ACCESS
      kind: predicate
      predicate:
        op: exists
        table: serviceOrigins
        where:
          service:
            ref: choice.service
          origin:
            ref: derived.origin
    - id: SHIP-SERVICE-DEPARTURE
      requirement: ACCESS
      kind: predicate
      predicate:
        op: exists
        table: serviceDepartures
        where:
          service:
            ref: choice.service
          departure:
            ref: choice.departure
    - id: SHIP-SERVICE-CAPACITY
      requirement: ACCESS
      kind: predicate
      predicate:
        op: gte
        args:
          - op: lookup
            table: services
            where:
              id:
                ref: choice.service
            column: capacity
          - ref: derived.loadQuantity
    - id: SHIP-SERVICE-BOOKING
      requirement: ACCESS
      kind: predicate
      predicate:
        op: and
        args:
          - op: eq
            args:
              - ref: parameter.bookingTime
              - op: lookup
                table: services
                where:
                  id:
                    ref: choice.service
                column: bookingTime
          - op: lte
            args:
              - ref: parameter.bookingTime
              - ref: choice.departure
    - id: SHIP-RECEIPT-WINDOW
      requirement: ACCESS
      kind: predicate
      predicate:
        op: and
        args:
          - op: gte
            args:
              - ref: derived.arrival
              - ref: parameter.receiptOpen
          - op: lt
            args:
              - ref: derived.arrival
              - ref: parameter.receiptClose
    - id: SHIP-RECEIPT-DEADLINE
      requirement: TIME
      kind: predicate
      predicate:
        op: lte
        args:
          - ref: derived.arrival
          - ref: parameter.deadline
    - id: SHIP-EXPENSE
      requirement: COST
      kind: predicate
      predicate:
        op: lte
        args:
          - ref: finance.expense
          - ref: parameter.expenseLimit
    - id: SHIP-CASH
      requirement: CASH
      kind: predicate
      predicate:
        op: lte
        args:
          - ref: finance.peakCash
          - ref: parameter.cashLimit
  finance:
    mode: expense-and-cash
    charges:
      - id: packing-labor
        amount:
          op: lookup
          table: workers
          where:
            id:
              ref: choice.packWorker
          column: fee
        at:
          ref: activity.pack.start
      - id: record-labor
        amount:
          op: lookup
          table: workers
          where:
            id:
              ref: choice.recordWorker
          column: fee
        at:
          ref: activity.record.start
      - id: release-labor
        amount:
          op: lookup
          table: workers
          where:
            id:
              ref: parameter.releaseActor
          column: fee
        at:
          ref: activity.release.start
      - id: site-handling
        amount:
          op: lookup
          table: sites
          where:
            id:
              ref: derived.origin
          column: handlingFee
        at:
          ref: activity.pack.start
      - id: carrier-fee
        amount:
          op: lookup
          table: services
          where:
            id:
              ref: choice.service
          column: fee
        at:
          ref: parameter.bookingTime
    holds:
      - id: carrier-hold
        amount:
          op: lookup
          table: services
          where:
            id:
              ref: choice.service
          column: hold
        start:
          ref: parameter.bookingTime
        end:
          ref: derived.arrival
  preference:
    direction: min
    expression:
      ref: finance.expense
    then:
      - direction: min
        expression:
          op: worst-case
          expression:
            ref: derived.arrival
  labels:
    plan: Shipment plan
    commitment: Accepted order
    item: Lot
    activity: Shipment activity
    actor: Assigned person
    scenario: Readiness and travel condition
    financeExpense: Incremental shipment expense
    financePeakCash: Peak cash in use
    arrival: Receipt at destination
    timeUnit: Day
    moneyUnit: Hypothetical USD
    choice.lotA: Lot for first order line
    choice.lotB: Lot for second order line
    choice.packWorker: Packing worker
    choice.recordWorker: Record-preparation worker
    choice.packStart: Packing starts
    choice.recordStart: Record preparation starts
    choice.releaseStart: Release starts
    choice.service: Carrier service
    choice.departure: Carrier departure
    choice.packWorker.A: Worker A
    choice.packWorker.B: Worker B
    choice.recordWorker.A: Worker A
    choice.recordWorker.B: Worker B
  version: "1.2.0"
  metadata:
    decisionPresentation:
      format: decision-presentation/1
      title: Complete shipment alternatives
      columns:
        - id: service
          source: "choice:service"
          label: Service
        - id: departure
          source: "choice:departure"
          label: Departure
          format:
            kind: time
            suffix: synthetic day
        - id: expense
          label: Incremental expense
          format:
            kind: money
            currency: USD
            divisor: 1
            suffix: hypothetical
      alternativeLabel:
        columnIds: [service, departure]
      comparisonFields:
        - id: packing-start
          source: "choice:packStart"
          label: Packing starts
          format:
            kind: time
            suffix: synthetic day
        - id: records-start
          source: "choice:recordStart"
          label: Record preparation starts
          format:
            kind: time
            suffix: synthetic day
        - id: release-start
          source: "choice:releaseStart"
          label: Release starts
          format:
            kind: time
            suffix: synthetic day
        - id: carrier-departure
          source: "choice:departure"
          label: Carrier departure
          format:
            kind: time
            suffix: synthetic day
        - id: peak-cash
          source: cash
          label: Peak cash needed
          format:
            kind: money
            currency: USD
            divisor: 1
            suffix: hypothetical
    catalog:
      domain:
        id: order-fulfillment
        label: Order fulfillment
        description: "Plan complete deliveries against accepted readiness, resource, permission, timing and financial constraints."
      useCase:
        id: complete-first-shipment
        label: Complete the first shipment
        description: Compare complete shipment plans that must meet every mandatory obligation across the declared readiness and travel scenarios.
    caseStart:
      starterMeaning: example
